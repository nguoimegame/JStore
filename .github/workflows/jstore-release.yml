#
# Builds, signs and publishes jstore for every tag vX.Y.Z. JaecooApp installs and updates
# jstore from the latest GitHub Release, so the asset names below are part of that contract:
# jstore.apk and jstore.apk.sha256 (hex only).
#
# Needs these repository secrets (the key must be JaecooApp's, or JaecooApp refuses the APK):
#   JSTORE_KEYSTORE_BASE64     the keystore file, base64-encoded
#   JSTORE_KEYSTORE_PASSWORD   store password
#   JSTORE_KEY_ALIAS           key alias
#   JSTORE_KEY_PASSWORD        key password

name: jstore release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0 (created on the selected branch if missing)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jstore-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # SHA-256 of JaecooApp's signing certificate. A jstore signed with anything else cannot
  # use JaecooApp's installer, so such a build is never published.
  EXPECTED_CERT_SHA256: 139f1d19f55e5f9b6cb5bd510df1e1266128463e41da59ef4540295178dab85a

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::Minor and patch must be below 100 to keep versionCode increasing"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: ./gradlew ktlintCheck testVanillaDebugUnitTest

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JSTORE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret JSTORE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jstore.keystore"

      - name: Build release APK
        env:
          JSTORE_KEYSTORE: ${{ runner.temp }}/jstore.keystore
          JSTORE_KEYSTORE_PASSWORD: ${{ secrets.JSTORE_KEYSTORE_PASSWORD }}
          JSTORE_KEY_ALIAS: ${{ secrets.JSTORE_KEY_ALIAS }}
          JSTORE_KEY_PASSWORD: ${{ secrets.JSTORE_KEY_PASSWORD }}
        run: >
          ./gradlew assembleVanillaRelease
          -PjstoreVersionName=${{ steps.version.outputs.name }}
          -PjstoreVersionCode=${{ steps.version.outputs.code }}

      - name: Verify the signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/vanilla/release/*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with $ACTUAL, expected JaecooApp's key"
            exit 1
          fi
          cp "$APK" jstore.apk
          sha256sum jstore.apk | awk '{print $1}' > jstore.apk.sha256
          ls -l jstore.apk jstore.apk.sha256

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/jstore.keystore"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: jstore ${{ steps.version.outputs.tag }}
          body: |
            Source: tag ${{ steps.version.outputs.tag }} of this repository (GNU GPL v3.0).
            jstore is based on Aurora Store by Aurora OSS and is not affiliated with them.
          generate_release_notes: true
          files: |
            jstore.apk
            jstore.apk.sha256
